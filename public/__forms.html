<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms</title>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <!-- Netlify Forms decoy — registers form definitions at build time -->
  <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input name="bot-field" />
  <input name="name" />
  <input name="business_name" />
  <input name="email" />
  <input name="phone" />
  <input name="state" />
  <input name="years_owning" />
  <input name="num_lots" />
  <input name="park_type" />
  <input name="annual_rents" />
  <input name="park_owned_homes" />
  <input name="traffic_source" />
  <input name="landing_url" />
  <input name="businessName" />
  <input name="parkType" />
  <input name="lots" />
  <input name="yearsOwned" />
  <input name="message" />
    <input type="text" name="property_street_address" />
    <input type="text" name="city" />
    <input type="text" name="zip" />
    <input type="text" name="mailing_address" />
    <input type="text" name="date_of_birth" />
    <input type="text" name="current_policy_number" />
    <input type="text" name="current_policy_expiration_date" />
</form>
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input name="bot-field">
    <input name="name">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <input type="hidden" name="traffic_source">
    <input type="hidden" name="landing_url">
    <textarea name="message"></textarea>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
